# Tech tips for the gym tablet on port 8090 (Windows XAMPP).
# Paste this at the end of C:\xampp\apache\conf\extra\httpd-vhosts.conf, change the two paths to the folder of
# this project (forward slashes!), save, then Stop + Start Apache in the XAMPP Control Panel.
# Same folder as the main site: Laravel itself only lets the tips through on this port (TIPS_PORT in .env).
Listen 8090

<VirtualHost *:8090>
    DocumentRoot "C:/xampp/htdocs/climbing"
    <Directory "C:/xampp/htdocs/climbing">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
