# Tech tips for the gym tablet on port 8090 (Ubuntu / Debian Apache).
#   sudo cp deploy/apache/tech-tips-ubuntu.conf /etc/apache2/sites-available/tech-tips.conf
#   sudo a2ensite tech-tips && sudo systemctl reload apache2
# Same folder as the main site: Laravel itself only lets the tips through on this port (TIPS_PORT in .env).
Listen 8090

<VirtualHost *:8090>
    DocumentRoot /var/www/html/
    <Directory /var/www/html/>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/tech-tips-error.log
    CustomLog ${APACHE_LOG_DIR}/tech-tips-access.log combined
</VirtualHost>
